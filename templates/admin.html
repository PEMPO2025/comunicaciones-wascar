
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wascar | Administración</title>
<style>
body{font:15px system-ui;background:#140821;color:white;margin:0;padding:25px}
h1{color:#ffe700}
a{color:#2fffea}
.box{max-width:1100px;margin:auto}
button{background:#e61a80;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.card{background:#2c143b;padding:16px;border:1px solid #e01cc2;border-radius:12px;margin:12px 0}
select{padding:10px;border-radius:8px}
#records{overflow-wrap:anywhere}
.notice{padding:12px;border-radius:8px;margin:12px 0;display:none}
.success{background:#075b48;color:white}
.error{background:#852233;color:white}
.info{background:#25385f;color:white}
</style>
</head>
<body>
<div class="box">
<a href="/">← Página principal</a>
<h1>COMUNICACIONES WASCAR</h1>
<h2>Panel de solicitudes · DEMOSTRACIÓN</h2>
<p>Sin dinero real ni boletos válidos.</p>

<div class="card">
<button id="load">Actualizar solicitudes</button>
<span id="stats"></span>
</div>

<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div id="records">Cargando solicitudes...</div>
</div>

<script>
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(
  /[&<>"']/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

function notify(message,type='info'){
  const el=$('notice');
  el.textContent=message;
  el.className='notice '+type;
  el.style.display='block';
}

async function load(){
  const btn=$('load');
  btn.disabled=true;
  btn.textContent='Actualizando...';

  try{
    const res=await fetch('/api/orders',{
      cache:'no-store',
      credentials:'same-origin'
    });

    if(!res.ok){
      throw new Error('Error HTTP '+res.status);
    }

    const data=await res.json();

    if(!Array.isArray(data.orders)){
      throw new Error('Respuesta de solicitudes inválida');
    }

    $('stats').textContent=
      data.orders.length+' solicitudes (máximo 500)';

    const records=$('records');
    records.replaceChildren();

    if(data.orders.length===0){
      records.textContent='No hay solicitudes.';
    }

    for(const o of data.orders){
      const card=document.createElement('div');
      card.className='card';

      const title=document.createElement('b');
      title.textContent=String(o.id ?? '');

      const details=document.createElement('p');
      details.textContent=
        `${o.name ?? ''} · ${o.phone ?? ''}`;

      const address=document.createElement('p');
      address.textContent='Dirección: '+(o.address ?? '');

      const reference=document.createElement('p');
      reference.textContent=
        'Referencia ficticia: '+(o.payment_reference ?? '')+
        ' · '+(o.payment_method ?? '');

      const tickets=document.createElement('p');
      tickets.textContent=
        'Números ficticios: '+(o.ticket1 ?? '')+
        ' y '+(o.ticket2 ?? '');

      const status=document.createElement('p');
      status.textContent='Estado actual: '+(o.status ?? '');

      const select=document.createElement('select');

      const options=[
        ['pending','Pendiente'],
        ['approved','Aprobado (simulado)'],
        ['rejected','Rechazado (simulado)']
      ];

      for(const [value,label] of options){
        const option=document.createElement('option');
        option.value=value;
        option.textContent=label;
        select.appendChild(option);
      }

      select.value=o.status;

      const save=document.createElement('button');
      save.textContent='Guardar estado';
      save.style.marginLeft='8px';

      save.onclick=async()=>{
        save.disabled=true;
        save.textContent='Guardando...';

        try{
          const response=await fetch('/api/status',{
            method:'POST',
            credentials:'same-origin',
            headers:{
              'Content-Type':'application/json'
            },
            body:JSON.stringify({
              id:o.id,
              status:select.value
            })
          });

          if(!response.ok){
            throw new Error('Error HTTP '+response.status);
          }

          notify(
            'Estado guardado correctamente para '+o.id,
            'success'
          );

          await load(false);

        }catch(error){
          notify(
            'No se pudo guardar: '+error.message,
            'error'
          );
        }finally{
          save.disabled=false;
          save.textContent='Guardar estado';
        }
      };

      card.append(
        title,details,address,reference,
        tickets,status,select,save
      );

      records.appendChild(card);
    }

    $('stats').textContent+=
      ' · Actualizado: '+new Date().toLocaleTimeString('es-DO');

  }catch(error){
    notify(
      'No se pudieron cargar las solicitudes: '+error.message,
      'error'
    );
  }finally{
    btn.disabled=false;
    btn.textContent='Actualizar solicitudes';
  }
}

$('load').onclick=()=>load();
load();
</script>
</body>
</html>
