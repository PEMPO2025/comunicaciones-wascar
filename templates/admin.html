<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wascar | Panel de pruebas</title><style>body{font:15px system-ui;background:#140821;color:white;margin:0;padding:25px}h1{color:#ffe700}a{color:#2fffea}.box{max-width:1100px;margin:auto}button{background:#e61a80;color:white;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}.card{background:#2c143b;padding:15px;border:1px solid #e01cc2;border-radius:12px;margin:12px 0}small{color:#ffda52}select{padding:8px}input{padding:10px;border-radius:8px;border:0}#records{overflow-wrap:anywhere}</style><div class="box"><a href="/">← Página principal</a><h1>COMUNICACIONES WASCAR</h1><h2>Panel de solicitudes · DEMOSTRACIÓN</h2><p>Sin dinero real ni boletos válidos. Acceso con credenciales de administrador configuradas en Railway.</p><div class="card"><button id="load">Actualizar solicitudes</button> <span id="stats"></span></div><div id="records">Pulsa actualizar para cargar solicitudes.</div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){let res=await fetch('/api/orders');if(!res.ok){document.getElementById('records').textContent='No autorizado. Recarga la página e inicia sesión.';return}let data=await res.json();document.getElementById('stats').textContent=data.orders.length+' solicitudes (máximo 500)';document.getElementById('records').innerHTML=data.orders.map(o=>`<div class="card"><b>${esc(o.id)}</b> · ${esc(o.name)} · ${esc(o.phone)}<p>Dirección: ${esc(o.address)}<br>Referencia ficticia: ${esc(o.payment_reference)} · ${esc(o.payment_method)}<br>Números ficticios: ${esc(o.ticket1)} y ${esc(o.ticket2)}<br>Estado: <strong>${esc(o.status)}</strong></p><select id="s-${esc(o.id)}"><option value="pending">Pendiente</option><option value="approved">Aprobado (simulado)</option><option value="rejected">Rechazado (simulado)</option></select> <button data-id="${esc(o.id)}">Guardar estado</button></div>`).join('')||'No hay solicitudes';for(const o of data.orders)document.getElementById('s-'+o.id).value=o.status;document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{const r=await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,status:document.getElementById('s-'+b.dataset.id).value})});if(!r.ok)alert('No se pudo guardar');load()})}
document.getElementById('load').onclick=load;load();</script></html>
